  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #060b14; font-family: 'Jua', sans-serif; }
    .ft { font-family: 'Black Han Sans', 'Jua', sans-serif; }

    @keyframes floatY    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
    @keyframes glowPulse { 0%,100%{box-shadow:0 0 22px rgba(56,189,248,.3)} 50%{box-shadow:0 0 52px rgba(56,189,248,.7)} }
    @keyframes shimmer   { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes slideUp   { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes popIn     { 0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.07)} 100%{transform:scale(1);opacity:1} }
    @keyframes dpulse    { 0%,100%{opacity:1} 50%{opacity:.45} }
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }

    .glow-anim   { animation: glowPulse 3s ease-in-out infinite; }
    .shimmer-txt {
      background: linear-gradient(90deg,#38bdf8,#a78bfa,#34d399,#38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 3.5s linear infinite;
    }
    .slide-up  { animation: slideUp .35s ease-out forwards; }
    .pop-in    { animation: popIn .4s cubic-bezier(.34,1.56,.64,1) forwards; }
    .dpulse    { animation: dpulse .8s ease-in-out infinite; }
    .fade-in   { animation: fadeIn .3s ease forwards; }
    .bar-fill  { transition: width .7s cubic-bezier(.4,0,.2,1); }
    .card-btn  { transition: transform .2s ease, border-color .2s ease, background .2s ease; }
    .card-btn:hover { transform: translateY(-5px) scale(1.015); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,.04); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

      {
        id:'glacier', name:'빙하 대량 해빙', emoji:'🧊',

        primary:{ key:'hydrosphere', delta:-15, text:'해수면이 상승하고 바닷물의 염분 농도가 낮아진다' },
        consequences:[
          { id:'a', correct:true,  key:'atmosphere',  delta:-12,
            text:'흰 얼음이 사라져 태양열 반사율이 줄고 지구가 더 많은 열을 흡수해 기온이 오른다',

          { id:'b', correct:true,  key:'biosphere',   delta:-14,
            text:'북극곰·펭귄 등 얼음 위에서 사는 동물의 서식지가 완전히 사라진다',
            reason:'빙하에 의존해 사는 동물들이 서식지를 잃어 멸종 위기에 처합니다. → 생물권에 영향' },

          { id:'d', correct:false, key:'hydrosphere', delta:0,
            text:'빙하가 녹으면 지구 전체의 물이 줄어들어 식수가 부족해진다',
            reason:'빙하가 녹으면 총 수량은 오히려 늘어납니다. 단, 담수 분포가 달라질 뿐입니다.' },
          { id:'e', correct:false, key:'atmosphere',  delta:0,

            reason:'이것은 정반대입니다. 빙하 감소→태양열 흡수 증가→기온 상승의 악순환이 일어납니다.' },
        ],
        basis:'[수권→기권→생물권→지권] 빙하 소실(수권)이 온난화 가속(기권), 서식지 붕괴(생물권), 해안 침수(지권)를 연쇄 일으킵니다.'
      },
    ];

    /* ── 헬퍼 ── */
    const clamp = v => Math.max(0, Math.min(100, v));
    const drawHand = (n=3) => [...CARDS].sort(()=>Math.random()-.5).slice(0,n);

    /* ── StatBar ── */
    function StatBar({ statKey, value, prevValue, highlight }) {
      const m = STAT_META[statKey];
      const danger  = value <= 20;
      const warning = value > 20 && value <= 35;
      const delta   = prevValue !== undefined ? value - prevValue : 0;
      const barClr  = danger ? '#ef4444' : warning ? '#f97316' : m.color;
      const hlClr   = highlight === 'good' ? '#22c55e' : highlight === 'bad' ? '#ef4444' : null;
      return (
        <div className={`rounded-xl p-3 border-2 transition-all duration-500 ${danger?'border-red-500/70 bg-red-950/30':warning?'border-orange-500/50 bg-orange-950/20':'border-white/10 bg-white/5'}`}
          style={hlClr?{outline:`3px solid ${hlClr}`,outlineOffset:2}:{}}>
          <div className="flex justify-between items-center mb-2">
            <div className="flex items-center gap-2">
              <span className="text-xl">{m.icon}</span>
              <div>
                <div className={`ft text-base leading-tight ${danger?'text-red-400 dpulse':'text-white'}`}>{m.label}</div>
                <div className="text-xs text-white/40">{m.sub}</div>
              </div>
            </div>
            <div className="flex items-center gap-1.5">
              {delta !== 0 && (
                <span className={`ft text-sm px-1.5 py-0.5 rounded-lg ${delta>0?'bg-green-900/50 text-green-400':'bg-red-900/50 text-red-400'}`}>
                  {delta > 0 ? `+${delta}` : delta}
                </span>
              )}
              <span className={`ft text-xl ${danger?'text-red-400':'text-white'}`}>{value}%</span>
            </div>
          </div>
          <div className="h-3 bg-white/10 rounded-full overflow-hidden">
            <div className="h-full rounded-full bar-fill"
              style={{ width:`${value}%`, background:`linear-gradient(90deg,${barClr}88,${barClr})` }} />
          </div>
        </div>
      );
    }

    /* ── Globe ── */
    function Globe({ stats }) {
      const avg    = Object.values(stats).reduce((a,b)=>a+b,0)/5;
      const crisis = Object.values(stats).some(v=>v<=20);
      const grad   = crisis
        ? 'radial-gradient(circle at 35% 30%,#2a0505,#500a0a,#1a0505)'
        : avg > 55
        ? 'radial-gradient(circle at 35% 30%,#0a2233,#0f4a30,#0a3349)'
        : 'radial-gradient(circle at 35% 30%,#171e2b,#1e3328,#172330)';
      return (
        <div className="relative flex items-center justify-center" style={{width:150,height:150}}>
          {[170,195].map(s=>(
            <div key={s} className="absolute rounded-full" style={{width:s,height:s,border:'1px solid rgba(56,189,248,0.08)'}}/>
          ))}
          <div className="rounded-full relative overflow-hidden float-anim glow-anim"
            style={{width:130,height:130,background:grad,border:crisis?'3px solid rgba(239,68,68,.6)':'2px solid rgba(56,189,248,.25)'}}>
            {!crisis && (<>
              <div className="absolute rounded-full" style={{width:42,height:28,background:'#22c55e44',top:32,left:22,transform:'rotate(-12deg)'}}/>
              <div className="absolute rounded-full" style={{width:26,height:36,background:'#22c55e38',bottom:28,right:18,transform:'rotate(18deg)'}}/>
              <div className="absolute inset-0" style={{background:'radial-gradient(ellipse at 60% 20%,rgba(255,255,255,.18) 0%,transparent 55%)'}}/>
            </>)}
            {crisis && <div className="text-4xl absolute inset-0 flex items-center justify-center dpulse">⚠️</div>}
          </div>
        </div>
      );
    }

    /* ── ConseqRow ── */
    function ConseqRow({ item, checked, pickedSphere, revealed, onToggle, onPickSphere }) {
      let rowStyle = 'border-white/12 bg-white/5 text-white/85';
      if (!revealed) {
        if (checked) rowStyle = 'border-sky-400/70 bg-sky-950/30 text-white';
      } else {
        if (item.correct && checked)   rowStyle = 'border-green-400/60 bg-green-950/25 text-white';
        if (item.correct && !checked)  rowStyle = 'border-green-500/30 bg-green-950/15 text-green-300/70';
        if (!item.correct && checked)  rowStyle = 'border-red-400/60 bg-red-950/25 text-white';
        if (!item.correct && !checked) rowStyle = 'border-white/8 bg-white/3 text-white/35';
      }
      return (
        <div className={`rounded-xl border-2 p-3 transition-all duration-300 ${rowStyle}`}>
          <div className="flex items-start gap-3">
            <button onClick={()=>!revealed && onToggle(item.id)} disabled={revealed}
              className={`mt-0.5 flex-shrink-0 w-6 h-6 rounded-md border-2 flex items-center justify-center transition-all ${revealed?'cursor-default':checked?'bg-sky-500 border-sky-400':'bg-white/5 border-white/30 hover:border-sky-400/60 cursor-pointer'}`}>
              {!revealed && checked && <span className="text-white text-sm font-bold">✓</span>}
              {revealed && item.correct  && <CheckCircle size={16} className="text-green-400" />}
              {revealed && !item.correct && <XCircle size={16} className="text-red-400" style={{opacity:.7}} />}
            </button>
            <div className="flex-1 min-w-0">
              <p className="text-base leading-snug">{item.text}</p>
              {revealed && (
                <p className={`text-sm mt-1.5 leading-relaxed fade-in ${item.correct?'text-green-300/90':'text-white/40'}`}>
                  💡 {item.reason}
                </p>
              )}
              {revealed && item.correct && (
                <div className="mt-2 flex items-center gap-2 fade-in flex-wrap">
                  <span className="text-sm text-white/40">영향 권역:</span>
                  <span className="ft text-sm px-2 py-0.5 rounded-lg"
                    style={{background:`${STAT_META[item.key].color}22`,border:`1px solid ${STAT_META[item.key].color}55`,color:STAT_META[item.key].color}}>
                    {STAT_META[item.key].icon} {STAT_META[item.key].label}
                  </span>
                  {pickedSphere && (
                    <span className={`ft text-sm ${pickedSphere===item.key?'text-green-400':'text-red-400'}`}>
                      {pickedSphere===item.key ? '✅ 정답!' : `❌ (내 답: ${STAT_META[pickedSphere].icon}${STAT_META[pickedSphere].label})`}
                    </span>
                  )}
                </div>
              )}
            </div>
          </div>
          {checked && !revealed && (
            <div className="mt-3 ml-9 fade-in">
              <p className="text-sm text-sky-300/80 mb-2 ft">→ 어느 권역에 영향을 미칠까요?</p>
              <div className="flex gap-2 flex-wrap">
                {SPHERES.map(sk => {
                  const sm = STAT_META[sk];
                  const sel = pickedSphere === sk;
                  return (
                    <button key={sk} onClick={()=>onPickSphere(item.id,sk)}
                      className="sphere-pill rounded-lg px-3 py-1.5 border-2 ft text-sm flex items-center gap-1.5"
                      style={{borderColor:sel?sm.color:'rgba(255,255,255,.15)',background:sel?`${sm.color}22`:'rgba(255,255,255,.04)',color:sel?sm.color:'rgba(255,255,255,.6)'}}>
                      {sm.icon} {sm.label}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ── ReportModal ── */
    function ReportModal({ stats, logs, score, turn, onClose }) {
      const avg   = Math.round(Object.values(stats).reduce((a,b)=>a+b,0)/5);
      const grade = avg>=70?'A':avg>=55?'B':avg>=40?'C':'D';
      const gc    = {A:'#22c55e',B:'#38bdf8',C:'#f97316',D:'#ef4444'}[grade];
      const events = logs.filter(l=>l.includes('선택:')).slice(0,10);
      return (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{background:'rgba(0,0,0,.85)'}}>
          <div className="rounded-2xl max-w-lg w-full p-6 overflow-y-auto slide-up" style={{background:'#0f172a',border:'1px solid rgba(56,189,248,.3)',maxHeight:'90vh'}}>
            <div className="flex justify-between items-center mb-5">
              <h2 className="ft text-2xl shimmer-txt">📊 학습 결과 리포트</h2>
              <button onClick={onClose} className="text-white/40 hover:text-white"><X size={20}/></button>
            </div>
            <div className="text-center rounded-2xl p-5 mb-5" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)'}}>
              <div className="ft text-6xl mb-1" style={{color:gc}}>{grade}</div>
              <div className="text-lg" style={{color:'rgba(255,255,255,.6)'}}>평균 생존율 {avg}% · {turn-1}턴 생존</div>
              <div className="ft text-xl mt-1" style={{color:'#fbbf24'}}>총점: {score}점</div>
            </div>
            <div className="mb-5">
              <div className="ft text-sm mb-3" style={{color:'rgba(255,255,255,.4)'}}>최종 권역 상태</div>
              {SPHERES.map(k=>(
                <div key={k} className="flex items-center gap-3 mb-2.5">
                  <span className="text-lg">{STAT_META[k].icon}</span>
                  <span className="ft text-base w-16" style={{color:'rgba(255,255,255,.7)'}}>{STAT_META[k].label}</span>
                  <div className="flex-1 h-3 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,.1)'}}>
                    <div className="h-full rounded-full" style={{width:`${stats[k]}%`,background:STAT_META[k].color}}/>
                  </div>
                  <span className="ft text-base w-10 text-right" style={{color:'rgba(255,255,255,.6)'}}>{stats[k]}%</span>
                </div>
              ))}
            </div>
            <div className="rounded-xl p-4 mb-4" style={{background:'rgba(30,58,138,.3)',border:'1px solid rgba(59,130,246,.2)'}}>
              <div className="ft text-sm mb-2" style={{color:'#93c5fd'}}>🔬 핵심 학습 포인트</div>
              <p className="text-base leading-relaxed" style={{color:'rgba(255,255,255,.7)'}}>
                지구계의 5가지 권역(기권·수권·지권·생물권·외권)은 독립적으로 존재하지 않습니다.
                하나의 자연현상이 발생하면 여러 권역에 연쇄적으로 영향을 줍니다. 이 상호작용을 이해하는 것이 지구과학의 핵심입니다!
              </p>
            </div>
            {events.length>0 && (
              <div className="rounded-xl p-3" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)'}}>
                <div className="ft text-sm mb-2" style={{color:'rgba(255,255,255,.4)'}}>📜 이벤트 기록</div>
                {events.map((l,i)=><div key={i} className="text-sm mb-1" style={{color:'rgba(255,255,255,.5)'}}>{l}</div>)}
              </div>
            )}
            <button onClick={onClose} className="mt-4 w-full py-3 ft text-base rounded-xl text-white"
              style={{background:'linear-gradient(135deg,#0ea5e9,#10b981)'}}>닫기</button>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════════
       MAIN APP
    ══════════════════════════════════════════ */
    function App() {
      const [screen,     setScreen]     = useState('intro');
      const [stats,      setStats]      = useState(INIT);
      const [prevStats,  setPrevStats]  = useState(INIT);
      const [turn,       setTurn]       = useState(1);
      const [hand,       setHand]       = useState([]);
      const [logs,       setLogs]       = useState([]);
      const [result,     setResult]     = useState(null);
      const [score,      setScore]      = useState(0);
      const [showReport, setShowReport] = useState(false);

      const [activeCard,  setActiveCard]  = useState(null);
      const [postPrimary, setPostPrimary] = useState(null);
      const [checkedIds,  setCheckedIds]  = useState(new Set());
      const [spherePicks, setSpherePicks] = useState({});
      const [revealed,    setRevealed]    = useState(false);
      const [highlights,  setHighlights]  = useState({});

      const logsRef = useRef(null);
      useEffect(()=>{ logsRef.current?.scrollTo(0,logsRef.current.scrollHeight); },[logs]);

      const addLog = (msg, t) => setLogs(p=>[...p,`[${t||turn}턴] ${msg}`]);

      function startGame() {
        setStats(INIT); setPrevStats(INIT); setTurn(1);
        setHand(drawHand(3)); setLogs([]); setResult(null); setScore(0);
        setActiveCard(null); setPostPrimary(null);
        setCheckedIds(new Set()); setSpherePicks({}); setRevealed(false); setHighlights({});
        setScreen('select');
      }

      function pickCard(card) {
        const after = {...stats};
        after[card.primary.key] = clamp(after[card.primary.key]+card.primary.delta);
        setPrevStats(stats); setPostPrimary(after); setActiveCard(card);
        setCheckedIds(new Set()); setSpherePicks({}); setRevealed(false); setHighlights({});
        addLog(`선택: "${card.name}"`, turn);
        setScreen('consequences');
      }

      function toggleCheck(id) {
        setCheckedIds(prev=>{
          const next = new Set(prev);
          if(next.has(id)){ next.delete(id); setSpherePicks(sp=>{const n={...sp};delete n[id];return n;}); }
          else next.add(id);
          return next;
        });
      }

      function pickSphere(cid, sk) { setSpherePicks(p=>({...p,[cid]:sk})); }

      function confirm() {
        if(checkedIds.size===0) return;
        for(const id of checkedIds) if(!spherePicks[id]) return;
        setRevealed(true);
        let ns={...postPrimary}; const hl={};
        let pts=2;
        activeCard.consequences.forEach(c=>{
          const yes=checkedIds.has(c.id); const sp=spherePicks[c.id]||null;
          if(yes&&c.correct){ pts+=3; if(c.delta!==0){ns[c.key]=clamp(ns[c.key]+c.delta);hl[c.key]=c.delta>0?'good':'bad';} if(sp===c.key)pts+=3; }
          else if(yes&&!c.correct) pts-=2;
        });
        pts=Math.max(0,pts);
        setScore(s=>s+pts); setStats(ns); setHighlights(hl);
        const ch=activeCard.consequences.filter(c=>c.correct&&checkedIds.has(c.id)).length;
        const sh=activeCard.consequences.filter(c=>c.correct&&checkedIds.has(c.id)&&spherePicks[c.id]===c.key).length;
        addLog(`결과 ${ch}개 정답·권역 ${sh}개 정답 → +${pts}점`, turn);
        const dead=Object.entries(ns).find(([,v])=>v===0);
        if(dead){setResult('lost');setTimeout(()=>setScreen('ended'),2200);return;}
        if(turn>=MAX_TURNS){setResult('won');setTimeout(()=>setScreen('ended'),2200);return;}
      }

      function nextTurn() {
        setTurn(t=>t+1); setHand(drawHand(3));
        setActiveCard(null); setPostPrimary(null);
        setCheckedIds(new Set()); setSpherePicks({}); setRevealed(false); setHighlights({});
        setScreen('select');
      }

      const displayStats = screen==='consequences' ? (postPrimary||stats) : stats;
      const allSpheresPicked = checkedIds.size>0 && [...checkedIds].every(id=>spherePicks[id]);

      /* ── INTRO ── */
      if(screen==='intro') return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6"
          style={{background:'radial-gradient(ellipse at 50% 0%,#0a1628 0%,#060b14 55%)'}}>
          <div className="max-w-xl w-full text-center">
            <div className="text-8xl mb-4 float-anim">🌍</div>
            <h1 className="ft text-4xl shimmer-txt mb-1">어스 밸런스</h1>
            <p className="text-base mb-1" style={{color:'rgba(255,255,255,.35)',letterSpacing:'0.1em'}}>EARTH SYSTEM SIMULATOR</p>
            <p className="text-sm mb-7 ft px-3 py-1.5 rounded-full inline-block" style={{color:'#7dd3fc',background:'rgba(56,189,248,.08)',border:'1px solid rgba(56,189,248,.2)'}}>
              중2 과학 · 지구계 — 여러 요소로 이루어진 지구계
            </p>
            <div className="rounded-2xl p-5 mb-6 text-left space-y-3" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)'}}>
              <p className="text-lg leading-relaxed" style={{color:'rgba(255,255,255,.8)'}}>
                지구를 이루는 <span className="ft" style={{color:'#38bdf8'}}>5가지 권역</span>이 서로 어떻게 영향을 주고받는지 체험하는 시뮬레이션입니다.
              </p>
              <div className="space-y-2">
                {[
                  ['①','rgba(255,255,255,.05)','transparent','자연현상 카드를 선택합니다'],
                  ['②','rgba(120,53,15,.3)','rgba(245,158,11,.25)','어떤 결과가 일어날지 체크합니다'],
                  ['③','rgba(88,28,135,.3)','rgba(167,139,250,.25)','체크한 항목마다 영향받는 권역을 선택합니다'],
                  ['④','rgba(255,255,255,.05)','transparent','정답 확인 + 과학적 원리 학습!'],
                ].map(([num,bg,bc,txt])=>(
                  <div key={num} className="flex items-center gap-3 rounded-xl px-4 py-2.5" style={{background:bg,border:`1px solid ${bc}`}}>
                    <span className="text-xl">{num}</span>
                    <span className="text-base" style={{color:'rgba(255,255,255,.8)'}}>{txt}</span>
                  </div>
                ))}
              </div>
              <p className="text-sm" style={{color:'rgba(255,255,255,.4)'}}>
                단 하나의 권역이라도 <span className="ft" style={{color:'#f87171'}}>0%</span>가 되면 게임 오버.&nbsp;
                <span className="ft" style={{color:'#4ade80'}}>{MAX_TURNS}턴</span> 동안 살아남으세요!
              </p>
            </div>
            <button onClick={startGame} className="w-full py-4 ft text-xl rounded-2xl text-white"
              style={{background:'linear-gradient(135deg,#0ea5e9,#06b6d4,#10b981)',boxShadow:'0 0 35px rgba(14,165,233,.4)'}}>
              시뮬레이션 시작 →
            </button>
            <div className="mt-6 pt-5 flex flex-col items-center gap-1" style={{borderTop:'1px solid rgba(255,255,255,.07)'}}>
              <p className="text-sm" style={{color:'rgba(255,255,255,.2)'}}>제작자: 과학이조선생</p>
              <a href="mailto:chuseonjae@outlook.kr" className="text-sm hover:text-sky-300 transition-colors flex items-center gap-1.5"
                style={{color:'rgba(255,255,255,.3)'}}>
                <span>✉️</span> chuseonjae@outlook.kr
              </a>
            </div>
          </div>
        </div>
      );

      /* ── ENDED ── */
      if(screen==='ended') return (
        <div className="min-h-screen flex flex-col items-center justify-center p-6"
          style={{background:result==='won'?'radial-gradient(ellipse at 50% 0%,#0a2010,#060b14 55%)':'radial-gradient(ellipse at 50% 0%,#200a0a,#060b14 55%)'}}>
          <div className="max-w-md w-full text-center">
            <div className="text-8xl mb-4 pop-in">{result==='won'?'🌟':'💥'}</div>
            <h2 className={`ft text-4xl mb-2 ${result==='won'?'text-green-400':'text-red-400'}`}>
              {result==='won'?'생태계 수호 성공!':'시스템 붕괴'}
            </h2>
            <p className="text-lg mb-7" style={{color:'rgba(255,255,255,.5)'}}>{turn-1}턴 생존 · 총점 {score}점</p>
            <div className="rounded-2xl p-5 mb-5" style={{background:'rgba(255,255,255,.05)',border:'1px solid rgba(255,255,255,.1)'}}>
              {SPHERES.map(k=>(
                <div key={k} className="flex items-center gap-3 mb-3">
                  <span className="text-lg">{STAT_META[k].icon}</span>
                  <span className="ft text-base w-16" style={{color:'rgba(255,255,255,.6)'}}>{STAT_META[k].label}</span>
                  <div className="flex-1 h-3 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,.1)'}}>
                    <div className="h-full rounded-full" style={{width:`${stats[k]}%`,background:STAT_META[k].color}}/>
                  </div>
                  <span className="ft text-base w-10 text-right" style={{color:'rgba(255,255,255,.6)'}}>{stats[k]}%</span>
                </div>
              ))}
            </div>
            <div className="flex gap-3 mb-3">
              <button onClick={()=>setShowReport(true)}
                className="flex-1 py-3.5 ft text-base rounded-xl flex items-center justify-center gap-2 transition-colors"
                style={{border:'1px solid rgba(56,189,248,.4)',color:'#7dd3fc'}}
                onMouseEnter={e=>e.currentTarget.style.background='rgba(8,47,73,.4)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <BarChart2 size={18}/> 결과 리포트
              </button>
              <button onClick={startGame} className="flex-1 py-3.5 ft text-base rounded-xl text-white"
                style={{background:'linear-gradient(135deg,#0ea5e9,#10b981)'}}>
                다시 도전
              </button>
            </div>
            <div className="mt-4 pt-4 flex flex-col items-center gap-1" style={{borderTop:'1px solid rgba(255,255,255,.07)'}}>
              <p className="text-sm" style={{color:'rgba(255,255,255,.2)'}}>제작자: 과학이조선생</p>
              <a href="mailto:chuseonjae@outlook.kr" className="text-sm flex items-center gap-1.5"
                style={{color:'rgba(255,255,255,.25)'}}>✉️ chuseonjae@outlook.kr</a>
            </div>
          </div>
          {showReport && <ReportModal stats={stats} logs={logs} score={score} turn={turn} onClose={()=>setShowReport(false)}/>}
        </div>
      );

      /* ── PLAYING ── */
      return (
        <div className="min-h-screen" style={{background:'radial-gradient(ellipse at 50% -5%,#071828 0%,#060b14 50%)'}}>
          {/* TOP BAR */}
          <header style={{borderBottom:'1px solid rgba(255,255,255,.07)',padding:'10px 20px'}}>
            <div className="max-w-7xl mx-auto flex justify-between items-center">
              <div className="flex items-center gap-3">
                <span className="text-xl">🌍</span>
                <div>
                  <span className="ft text-lg shimmer-txt">어스 밸런스</span>
                  <span className="ft text-xs ml-3 px-2 py-0.5 rounded-full" style={{color:'#7dd3fc',background:'rgba(56,189,248,.08)',border:'1px solid rgba(56,189,248,.2)'}}>
                    중2 과학 · 지구계
                  </span>
                </div>
              </div>
              <div className="flex items-center gap-5">
                <div className="text-center">
                  <div className="ft text-xl text-sky-400">{turn}<span className="text-base" style={{color:'rgba(255,255,255,.25)'}}>/{MAX_TURNS}</span></div>
                  <div className="text-xs" style={{color:'rgba(255,255,255,.3)'}}>TURN</div>
                </div>
                <div className="text-center">
                  <div className="ft text-xl" style={{color:'#fbbf24'}}>{score}</div>
                  <div className="text-xs" style={{color:'rgba(255,255,255,.3)'}}>점수</div>
                </div>
                <button onClick={startGame}
                  className="p-2 rounded-xl transition-all"
                  style={{border:'1px solid rgba(255,255,255,.1)',color:'rgba(255,255,255,.3)'}}
                  onMouseEnter={e=>{e.currentTarget.style.color='white';e.currentTarget.style.borderColor='rgba(255,255,255,.3)';}}
                  onMouseLeave={e=>{e.currentTarget.style.color='rgba(255,255,255,.3)';e.currentTarget.style.borderColor='rgba(255,255,255,.1)';}}>
                  <RefreshCw size={15}/>
                </button>
              </div>
            </div>
            <div className="max-w-7xl mx-auto mt-2">
              <div className="h-1 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,.05)'}}>
                <div className="h-full rounded-full transition-all duration-500"
                  style={{width:`${(turn/MAX_TURNS)*100}%`,background:'linear-gradient(90deg,#0ea5e9,#10b981)'}}/>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto p-4 flex gap-4" style={{minHeight:'calc(100vh - 70px)'}}>
            {/* LEFT: GLOBE + STATS + LOG */}
            <div className="flex-shrink-0 flex flex-col gap-3" style={{width:265}}>
              <div className="flex justify-center py-1"><Globe stats={displayStats}/></div>
              <div className="ft text-xs text-center" style={{color:'rgba(255,255,255,.3)',letterSpacing:'0.1em'}}>지구 권역 상태</div>
              {SPHERES.map(k=>(
                <StatBar key={k} statKey={k} value={displayStats[k]} prevValue={prevStats[k]} highlight={revealed?highlights[k]:null}/>
              ))}
              <div ref={logsRef} className="rounded-xl p-3 overflow-y-auto mt-1" style={{border:'1px solid rgba(255,255,255,.07)',background:'rgba(0,0,0,.3)',height:88}}>
                {logs.length===0 && <p className="text-sm text-center" style={{color:'rgba(255,255,255,.2)',marginTop:8}}>이벤트 기록</p>}
                {logs.map((l,i)=>(
                  <div key={i} className="text-sm mb-1 leading-snug"
                    style={{color:l.includes('선택:')?'#fcd34d':l.includes('정답')?'#7dd3fc':'rgba(255,255,255,.3)'}}>
                    {l}
                  </div>
                ))}
              </div>
              {/* Contact */}
              <div className="text-center mt-auto pt-2" style={{borderTop:'1px solid rgba(255,255,255,.05)'}}>
                <a href="mailto:chuseonjae@outlook.kr" className="text-xs flex items-center justify-center gap-1 transition-colors hover:text-sky-400"
                  style={{color:'rgba(255,255,255,.2)'}}>
                  ✉️ chuseonjae@outlook.kr
                </a>
              </div>
            </div>

            {/* RIGHT */}
            <div className="flex-1 flex flex-col gap-4 min-w-0">

              {/* PHASE 1 */}
              {screen==='select' && (
                <>
                  <div>
                    <h2 className="ft text-2xl text-white">자연현상을 선택하세요</h2>
                    <p className="text-base mt-1" style={{color:'rgba(255,255,255,.45)'}}>카드를 선택하면 연쇄 결과를 직접 예측할 수 있어요</p>
                  </div>
                  <div className="flex flex-col gap-4 flex-1">
                    {hand.map((card,i)=>(
                      <button key={i} onClick={()=>pickCard(card)}
                        className="card-btn rounded-2xl p-5 text-left w-full"
                        style={{border:'2px solid rgba(255,255,255,.12)',background:'rgba(255,255,255,.05)'}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor='rgba(56,189,248,.6)';e.currentTarget.style.background='rgba(8,47,73,.15)';}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor='rgba(255,255,255,.12)';e.currentTarget.style.background='rgba(255,255,255,.05)';}}>
                        <div className="flex items-center gap-4">
                          <span className="text-5xl flex-shrink-0">{card.emoji}</span>
                          <div className="flex-1 min-w-0">
                            <h3 className="ft text-xl text-white mb-0.5">{card.name}</h3>
                            <p className="text-base mb-3 leading-snug" style={{color:'rgba(255,255,255,.5)'}}>{card.desc}</p>
                            <div className="flex items-center gap-2 rounded-xl px-3 py-2" style={{background:'rgba(0,0,0,.3)',border:'1px solid rgba(255,255,255,.08)'}}>
                              <span className="ft text-sm flex-shrink-0" style={{color:'rgba(255,255,255,.4)'}}>1차 효과:</span>
                              <span className="text-base flex-1" style={{color:'rgba(255,255,255,.7)'}}>{card.primary.text}</span>
                              <span className={`ml-2 ft text-base flex-shrink-0 ${card.primary.delta>0?'text-green-400':'text-red-400'}`}>
                                {STAT_META[card.primary.key].icon}{card.primary.delta>0?`+${card.primary.delta}`:card.primary.delta}
                              </span>
                            </div>
                          </div>
                          <ChevronRight size={22} className="flex-shrink-0" style={{color:'rgba(255,255,255,.25)'}}/>
                        </div>
                      </button>
                    ))}
                  </div>
                </>
              )}

              {/* PHASE 2 */}
              {screen==='consequences' && activeCard && (
                <div className="flex flex-col gap-4 flex-1 slide-up">
                  {/* Card header */}
                  <div className="rounded-2xl p-4 flex-shrink-0" style={{border:'2px solid rgba(245,158,11,.4)',background:'rgba(120,53,15,.2)'}}>
                    <div className="flex items-center gap-3 mb-3">
                      <span className="text-3xl">{activeCard.emoji}</span>
                      <div>
                        <h2 className="ft text-xl" style={{color:'#fcd34d'}}>{activeCard.name}</h2>
                        <p className="text-base" style={{color:'rgba(255,255,255,.55)'}}>{activeCard.desc}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3 rounded-xl px-3 py-2" style={{background:'rgba(0,0,0,.25)',border:'1px solid rgba(245,158,11,.2)'}}>
                      <span className="ft text-sm flex-shrink-0" style={{color:'rgba(245,158,11,.7)'}}>✅ 1차 효과:</span>
                      <span className="text-base flex-1" style={{color:'rgba(255,255,255,.8)'}}>{activeCard.primary.text}</span>
                      <span className={`ft text-base flex-shrink-0 ${activeCard.primary.delta>0?'text-green-400':'text-red-400'}`}>
                        {STAT_META[activeCard.primary.key].icon}{activeCard.primary.delta>0?`+${activeCard.primary.delta}`:activeCard.primary.delta}
                      </span>
                    </div>
                  </div>

                  {/* Step guide */}
                  {!revealed ? (
                    <div className="flex gap-3 flex-shrink-0">
                      <div className="flex-1 rounded-xl px-3 py-2 flex items-center gap-2" style={{background:'rgba(8,47,73,.3)',border:'1px solid rgba(56,189,248,.3)'}}>
                        <span className="ft text-sm" style={{color:'#7dd3fc'}}>STEP 1</span>
                        <span className="text-sm" style={{color:'rgba(255,255,255,.7)'}}>실제로 일어날 결과를 모두 체크하세요</span>
                      </div>
                      <div className="flex-1 rounded-xl px-3 py-2 flex items-center gap-2" style={{background:'rgba(88,28,135,.3)',border:'1px solid rgba(167,139,250,.3)'}}>
                        <span className="ft text-sm" style={{color:'#c4b5fd'}}>STEP 2</span>
                        <span className="text-sm" style={{color:'rgba(255,255,255,.7)'}}>체크한 항목마다 영향받는 권역을 선택하세요</span>
                      </div>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2 flex-shrink-0">
                      <Info size={18} className="text-green-400 flex-shrink-0"/>
                      <p className="ft text-lg text-green-300">결과 확인 — 과학적 원리를 읽어보세요!</p>
                    </div>
                  )}

                  {/* Rows */}
                  <div className="flex flex-col gap-2.5 overflow-y-auto pr-1" style={{flex:1,maxHeight:'calc(100vh - 380px)'}}>
                    {activeCard.consequences.map(c=>(
                      <ConseqRow key={c.id} item={c}
                        checked={checkedIds.has(c.id)} pickedSphere={spherePicks[c.id]||null}
                        revealed={revealed} onToggle={toggleCheck} onPickSphere={pickSphere}/>
                    ))}
                  </div>

                  {/* CTA */}
                  <div className="flex-shrink-0">
                    {!revealed ? (
                      <div>
                        {checkedIds.size>0 && !allSpheresPicked && (
                          <p className="ft text-sm text-center mb-2" style={{color:'rgba(251,191,36,.8)'}}>
                            ⚠️ 체크한 항목의 권역을 모두 선택해야 확인할 수 있어요
                          </p>
                        )}
                        <button onClick={confirm} disabled={!allSpheresPicked}
                          className={`w-full py-4 ft text-lg rounded-2xl text-white transition-all ${allSpheresPicked?'cursor-pointer':'cursor-not-allowed opacity-40'}`}
                          style={allSpheresPicked?{background:'linear-gradient(135deg,#0ea5e9,#10b981)',boxShadow:'0 0 25px rgba(14,165,233,.3)'}:{background:'#1e293b'}}>
                          {checkedIds.size===0?'결과를 체크해 주세요'
                            :!allSpheresPicked?`권역 선택 중... (${[...checkedIds].filter(id=>spherePicks[id]).length}/${checkedIds.size} 완료)`
                            :'선택 완료 → 결과 확인하기'}
                        </button>
                      </div>
                    ) : (
                      <button onClick={nextTurn} className="w-full py-4 ft text-lg rounded-2xl text-white"
                        style={{background:'linear-gradient(135deg,#7c3aed,#0ea5e9)',boxShadow:'0 0 25px rgba(124,58,237,.3)'}}>
                        다음 턴으로 → ({Math.min(turn+1,MAX_TURNS)}/{MAX_TURNS}턴)
                      </button>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
